<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerozx TikTok Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tiktok-cyan: #25f4ee;
            --tiktok-red: #fe2c55;
            --tiktok-pink: #ff0050;
            --bg: #000000;
            --card: rgba(15, 15, 20, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #8a8a95;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 15% 15%, rgba(37, 244, 238, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(254, 44, 85, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 80, 0.08) 0%, transparent 60%);
            z-index: -1;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* Grid pattern */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        .container {
            background: var(--card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 52px 48px;
            width: 100%;
            max-width: 640px;
            box-shadow:
                0 30px 60px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            animation: containerIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Dual glow border */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red), var(--tiktok-cyan));
            border-radius: 34px;
            z-index: -1;
            opacity: 0.35;
            filter: blur(24px);
            animation: borderGlow 5s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.35; transform: rotate(0deg); }
            50% { opacity: 0.65; transform: rotate(2deg); }
        }

        /* Logo */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #000, #1a1a2e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 30px rgba(37, 244, 238, 0.3),
                0 0 60px rgba(254, 44, 85, 0.2);
            animation: logoFloat 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(37, 244, 238, 0.15), rgba(254, 44, 85, 0.15));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .logo-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(37, 244, 238, 0.6));
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--tiktok-cyan), #ffffff, var(--tiktok-red));
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 4s linear infinite;
            letter-spacing: -1px;
        }

        @keyframes shine {
            to { background-position: 250% center; }
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 36px;
            font-size: 14px;
            font-weight: 400;
        }

        .subtitle .badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(37, 244, 238, 0.15), rgba(254, 44, 85, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        input {
            flex: 1;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        input::placeholder { color: var(--text-dim); }

        input:focus {
            outline: none;
            border-color: rgba(37, 244, 238, 0.5);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(37, 244, 238, 0.1);
        }

        button#downloadBtn {
            padding: 18px 34px;
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border: none;
            border-radius: 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(254, 44, 85, 0.4);
        }

        button#downloadBtn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        button#downloadBtn:hover::before { left: 100%; }

        button#downloadBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(254, 44, 85, 0.6);
        }

        button#downloadBtn:active { transform: translateY(-1px); }

        button#downloadBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        button#downloadBtn svg { width: 18px; height: 18px; fill: white; }

        .result { margin-top: 28px; display: none; }
        .result.show { display: block; animation: resultIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes resultIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .video-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--tiktok-cyan), var(--tiktok-red));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .video-card:hover::before { opacity: 1; }

        .video-card:hover {
            border-color: rgba(37, 244, 238, 0.3);
            box-shadow: 0 10px 40px rgba(254, 44, 85, 0.15);
            transform: translateY(-2px);
        }

        .video-thumb {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s;
        }

        .video-thumb:hover { transform: scale(1.02); }

        .video-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text);
            font-weight: 700;
            line-height: 1.5;
        }

        .video-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .video-author strong { color: #fff; }

        .video-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .meta-item svg { width: 14px; height: 14px; fill: var(--tiktok-cyan); }
        .meta-item.likes svg { fill: var(--tiktok-red); }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 20px;
            background: rgba(37, 244, 238, 0.08);
            border: 1px solid rgba(37, 244, 238, 0.25);
            border-radius: 14px;
            color: var(--tiktok-cyan);
            text-align: center;
            text-decoration: none;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .download-btn.primary {
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
        }

        .download-btn.primary:hover {
            box-shadow: 0 10px 30px rgba(254, 44, 85, 0.5);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background: rgba(37, 244, 238, 0.15);
            box-shadow: 0 10px 25px rgba(37, 244, 238, 0.2);
        }

        .download-btn:hover svg { transform: translateY(3px); }

        .loading {
            text-align: center;
            padding: 36px;
            color: var(--text-dim);
            display: none;
        }

        .loading.show { display: block; }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(37, 244, 238, 0.15);
            border-top-color: var(--tiktok-cyan);
            border-right-color: var(--tiktok-red);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 16px 20px;
            border-radius: 14px;
            margin-top: 24px;
            display: none;
            font-size: 14px;
            animation: shake 0.5s;
            align-items: center;
            gap: 12px;
        }

        .error.show { display: flex; }

        .error svg { width: 22px; height: 22px; fill: #fca5a5; flex-shrink: 0; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer .dot {
            width: 6px;
            height: 6px;
            background: var(--tiktok-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--tiktok-cyan);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @media (max-width: 600px) {
            .container { padding: 32px 22px; border-radius: 24px; }
            h1 { font-size: 26px; }
            .input-group { flex-direction: column; }
            button#downloadBtn { width: 100%; }
            .video-meta { gap: 10px; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--tiktok-cyan), var(--tiktok-red));
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/>
                </svg>
            </div>
        </div>

        <h1>ZEROZX TIKTOK</h1>
        <div class="subtitle">
            Download video TikTok tanpa watermark <span class="badge">HD</span>
        </div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste link TikTok di sini...">
            <button onclick="download()" id="downloadBtn">
                <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                Download
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Ngambil video... sabar cuy</p>
        </div>

        <div class="error" id="error">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="errorText"></span>
        </div>

        <div class="result" id="result"></div>

        <div class="footer">
            <span class="dot"></span>
            Zerozx System v3.0 | TikTok Only | No Watermark
        </div>
    </div>

    <script>
        async function download() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            if (!url) {
                showError('Masukin link TikTok dulu cuy!');
                return;
            }

            result.classList.remove('show');
            error.classList.remove('show');
            loading.classList.add('show');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0;display:inline-block;"></div> Loading...';

            try {
                const response = await fetch('/api/tiktok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Gagal download');
                renderResult(data);

            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('show');
                btn.disabled = false;
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> Download';
            }
        }

        function renderResult(data) {
            const result = document.getElementById('result');

            const iconDownload = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>';
            const iconVideo = '<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>';
            const iconMusic = '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>';
            const iconEye = '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
            const iconHeart = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

            result.innerHTML = `
                <div class="video-card">
                    <img src="${data.thumbnail}" class="video-thumb" alt="Thumbnail">
                    <div class="video-title">${data.title}</div>
                    <div class="video-author">
                        👤 <strong>@${data.author}</strong> ${data.author_nickname !== 'Unknown' ? `· ${data.author_nickname}` : ''}
                    </div>
                    <div class="video-meta">
                        <div class="meta-item">${iconEye} ${formatNumber(data.stats.plays)}</div>
                        <div class="meta-item likes">${iconHeart} ${formatNumber(data.stats.likes)}</div>
                        <div class="meta-item">💬 ${formatNumber(data.stats.comments)}</div>
                        <div class="meta-item">🔗 ${formatNumber(data.stats.shares)}</div>
                    </div>
                    <a href="${data.video_no_watermark}" target="_blank" class="download-btn primary" download>
                        ${iconDownload} Download Tanpa Watermark
                    </a>
                    ${data.video_hd ? `
                    <a href="${data.video_hd}" target="_blank" class="download-btn" download>
                        ${iconVideo} Download HD
                    </a>` : ''}
                    ${data.music ? `
                    <a href="${data.music}" target="_blank" class="download-btn" download>
                        ${iconMusic} Download Audio
                    </a>` : ''}
                </div>
            `;
            result.classList.add('show');
        }

        function formatNumber(n) {
            if (!n) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }

        function showError(msg) {
            const error = document.getElementById('error');
            document.getElementById('errorText').textContent = msg;
            error.classList.add('show');
        }

        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') download();
        });
    </script>
</body>
</html>
