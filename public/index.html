<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerozx TikTok Downloader + AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tiktok-cyan: #25f4ee;
            --tiktok-red: #fe2c55;
            --tiktok-pink: #ff0050;
            --ai-purple: #8b5cf6;
            --ai-blue: #3b82f6;
            --card: rgba(15, 15, 20, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #8a8a95;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 15% 15%, rgba(37, 244, 238, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(254, 44, 85, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            z-index: -1;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .container {
            background: var(--card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px 48px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            animation: containerIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red), var(--ai-purple));
            border-radius: 34px;
            z-index: -1;
            opacity: 0.35;
            filter: blur(24px);
            animation: borderGlow 5s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.65; }
        }

        /* ========== BURGER MENU BUTTON ========== */
        .burger-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s;
            z-index: 10;
        }

        .burger-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(37, 244, 238, 0.4);
        }

        .burger-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .burger-btn:hover span {
            background: var(--tiktok-cyan);
        }

        /* ========== SIDE MENU ========== */
        .side-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(10, 10, 15, 0.98);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--border);
            z-index: 9999;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .side-menu.open { left: 0; }

        .side-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .side-menu-title {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .side-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .side-close:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .side-close svg { width: 16px; height: 16px; fill: currentColor; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            width: 100%;
        }

        .menu-item:hover {
            background: rgba(37, 244, 238, 0.08);
            border-color: rgba(37, 244, 238, 0.3);
            transform: translateX(5px);
        }

        .menu-item svg {
            width: 20px;
            height: 20px;
            fill: var(--tiktok-cyan);
            flex-shrink: 0;
        }

        .menu-item.ai svg { fill: var(--ai-purple); }
        .menu-item.ai:hover { background: rgba(139, 92, 246, 0.08); border-color: rgba(139, 92, 246, 0.3); }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .menu-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ========== HISTORY PANEL ========== */
        .history-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: rgba(10, 10, 15, 0.98);
            backdrop-filter: blur(30px);
            border-left: 1px solid var(--border);
            z-index: 9999;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history-panel.open { right: 0; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        .clear-history-btn {
            padding: 8px 14px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #fca5a5;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .clear-history-btn:hover { background: rgba(239, 68, 68, 0.25); }

        .history-list { display: flex; flex-direction: column; gap: 10px; }

        .history-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            align-items: center;
        }

        .history-item:hover { border-color: rgba(37, 244, 238, 0.3); }

        .history-thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .history-info { flex: 1; overflow: hidden; }

        .history-item-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-meta {
            font-size: 11px;
            color: var(--text-dim);
            display: flex;
            gap: 8px;
        }

        .history-delete {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .history-delete:hover { background: rgba(239, 68, 68, 0.25); }
        .history-delete svg { width: 14px; height: 14px; fill: currentColor; }

        .history-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .history-empty svg {
            width: 48px;
            height: 48px;
            fill: var(--text-dim);
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .logo-wrap { display: flex; justify-content: center; margin-bottom: 20px; }

        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #000, #1a1a2e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(37, 244, 238, 0.3), 0 0 50px rgba(254, 44, 85, 0.2);
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .logo-icon svg { width: 36px; height: 36px; fill: white; }

        h1 {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--tiktok-cyan), #fff, var(--tiktok-red));
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 4s linear infinite;
        }

        @keyframes shine { to { background-position: 250% center; } }

        .subtitle { text-align: center; color: var(--text-dim); margin-bottom: 28px; font-size: 14px; }

        .input-group { display: flex; gap: 10px; margin-bottom: 24px; }

        input {
            flex: 1;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        input::placeholder { color: var(--text-dim); }

        input:focus {
            outline: none;
            border-color: rgba(37, 244, 238, 0.5);
            box-shadow: 0 0 0 4px rgba(37, 244, 238, 0.1);
        }

        button#downloadBtn {
            padding: 16px 30px;
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(254, 44, 85, 0.4);
        }

        button#downloadBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(254, 44, 85, 0.6); }
        button#downloadBtn:disabled { opacity: 0.6; cursor: not-allowed; }
        button#downloadBtn svg { width: 18px; height: 18px; fill: white; }

        .result { margin-top: 24px; display: none; }
        .result.show { display: block; }

        .video-card { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 20px; padding: 22px; }
        .video-thumb { width: 100%; border-radius: 14px; margin-bottom: 18px; }
        .video-title { font-size: 15px; margin-bottom: 10px; font-weight: 700; line-height: 1.5; }
        .video-author { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: var(--text-dim); }
        .video-author strong { color: #fff; }

        .video-meta {
            display: flex; gap: 14px; flex-wrap: wrap;
            margin-bottom: 18px; padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px; border: 1px solid var(--border);
        }

        .meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }
        .meta-item svg { width: 13px; height: 13px; fill: var(--tiktok-cyan); }
        .meta-item.likes svg { fill: var(--tiktok-red); }

        .download-btn {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 14px 18px;
            background: rgba(37, 244, 238, 0.08);
            border: 1px solid rgba(37, 244, 238, 0.25);
            border-radius: 12px; color: var(--tiktok-cyan);
            text-align: center; text-decoration: none;
            margin-bottom: 8px; font-size: 13px; font-weight: 700;
            transition: all 0.3s;
        }

        .download-btn.primary {
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border-color: transparent; color: #fff;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
        }

        .download-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .download-btn:hover { transform: translateY(-2px); }

        .loading { text-align: center; padding: 30px; color: var(--text-dim); display: none; }
        .loading.show { display: block; }

        .spinner {
            display: inline-block; width: 36px; height: 36px;
            border: 3px solid rgba(37, 244, 238, 0.15);
            border-top-color: var(--tiktok-cyan);
            border-right-color: var(--tiktok-red);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5; padding: 14px 18px;
            border-radius: 12px; margin-top: 20px;
            display: none; font-size: 13px;
            align-items: center; gap: 10px;
        }

        .error.show { display: flex; }
        .error svg { width: 20px; height: 20px; fill: #fca5a5; }

        .footer {
            text-align: center; margin-top: 28px;
            font-size: 11px; color: var(--text-dim);
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .footer .dot {
            width: 6px; height: 6px; background: var(--tiktok-cyan);
            border-radius: 50%; box-shadow: 0 0 10px var(--tiktok-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ========== CHAT MODAL ========== */
        .chat-modal {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-modal.show { display: flex; }

        .chat-window {
            width: 100%; max-width: 560px; height: 80vh; max-height: 700px;
            background: rgba(15, 15, 20, 0.98);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-avatar {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            display: flex; align-items: center; justify-content: center;
        }

        .chat-avatar svg { width: 20px; height: 20px; fill: white; }

        .chat-info { flex: 1; }
        .chat-name { font-size: 14px; font-weight: 700; color: #fff; }
        .chat-status { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; }
        .chat-status .status-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

        .chat-close {
            width: 34px; height: 34px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .chat-close:hover { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
        .chat-close svg { width: 16px; height: 16px; fill: currentColor; }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 18px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 3px; }

        .message {
            max-width: 80%; padding: 11px 15px;
            border-radius: 14px; font-size: 13px; line-height: 1.5;
            word-wrap: break-word; white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            color: white; border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text); border-bottom-left-radius: 4px;
        }

        .message.typing { display: flex; gap: 4px; padding: 14px; }
        .message.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ai-purple); animation: typing 1.4s infinite; }
        .message.typing span:nth-child(2) { animation-delay: 0.2s; }
        .message.typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-6px); opacity: 1; } }

        .chat-input-area {
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            display: flex; gap: 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-input-area input {
            flex: 1; padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px;
        }

        .chat-input-area input:focus { outline: none; border-color: rgba(139, 92, 246, 0.5); }

        .chat-send {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .chat-send:hover { transform: translateY(-2px); }
        .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-send svg { width: 18px; height: 18px; fill: white; }

        @media (max-width: 600px) {
            .container { padding: 28px 20px; border-radius: 24px; }
            h1 { font-size: 24px; }
            .input-group { flex-direction: column; }
            button#downloadBtn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- BURGER BUTTON -->
        <button type="button" class="burger-btn" id="burgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/></svg>
            </div>
        </div>

        <h1>ZEROZX TIKTOK</h1>
        <div class="subtitle">Download video TikTok tanpa watermark</div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste link TikTok di sini...">
            <button type="button" id="downloadBtn">
                <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                Download
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Ngambil video... sabar cuy</p>
        </div>

        <div class="error" id="error">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="errorText"></span>
        </div>

        <div class="result" id="result"></div>

        <div class="footer">
            <span class="dot"></span>
            Zerozx System v4.0 | TikTok + AI + History
        </div>
    </div>

    <!-- SIDE MENU -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <div class="side-menu-title">MENU</div>
            <button type="button" class="side-close" id="sideClose">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <button type="button" class="menu-item" id="menuHistory">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            History Download
        </button>
        <button type="button" class="menu-item ai" id="menuAI">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.88.54 3.63 1.46 5.12L2 22l4.88-1.46C8.37 21.46 10.12 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
            Chat Zerozx AI
        </button>
    </div>

    <!-- HISTORY PANEL -->
    <div class="history-panel" id="historyPanel">
        <div class="panel-header">
            <div class="panel-title">📜 Riwayat Download</div>
            <div class="panel-actions">
                <button type="button" class="clear-history-btn" id="clearHistoryBtn">Hapus Semua</button>
            </div>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- CHAT MODAL -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-window">
            <div class="chat-header">
                <div class="chat-avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.88.54 3.63 1.46 5.12L2 22l4.88-1.46C8.37 21.46 10.12 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
                </div>
                <div class="chat-info">
                    <div class="chat-name">Zerozx AI</div>
                    <div class="chat-status">
                        <span class="status-dot"></span> Online · Groq
                    </div>
                </div>
                <button type="button" class="chat-close" id="chatClose">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">Halo cuy! Gw Zerozx AI. Ada yang bisa gw bantu?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ketik pesan...">
                <button type="button" class="chat-send" id="chatSend">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        var chatHistory = [];
        var HISTORY_KEY = 'zerozx_history';

        // ========== BURGER MENU ==========
        document.getElementById('burgerBtn').addEventListener('click', function() {
            document.getElementById('sideMenu').classList.add('open');
            document.getElementById('menuOverlay').classList.add('show');
        });

        document.getElementById('sideClose').addEventListener('click', closeMenu);
        document.getElementById('menuOverlay').addEventListener('click', closeMenu);

        function closeMenu() {
            document.getElementById('sideMenu').classList.remove('open');
            document.getElementById('menuOverlay').classList.remove('show');
        }

        // ========== MENU ACTIONS ==========
        document.getElementById('menuHistory').addEventListener('click', function() {
            closeMenu();
            document.getElementById('historyPanel').classList.add('open');
            renderHistory();
        });

        document.getElementById('menuAI').addEventListener('click', function() {
            closeMenu();
            document.getElementById('chatModal').classList.add('show');
            setTimeout(function() {
                document.getElementById('chatInput').focus();
            }, 300);
        });

        // ========== HISTORY ==========
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveHistory(history) {
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch (e) {}
        }

        function addToHistory(data) {
            var history = getHistory();
            history.unshift({
                id: Date.now(),
                title: data.title,
                author: data.author,
                thumbnail: data.thumbnail,
                video_no_watermark: data.video_no_watermark,
                date: new Date().toLocaleString('id-ID')
            });
            if (history.length > 50) history = history.slice(0, 50);
            saveHistory(history);
        }

        function removeFromHistory(id) {
            var history = getHistory();
            history = history.filter(function(item) { return item.id !== id; });
            saveHistory(history);
            renderHistory();
        }

        function clearHistory() {
            if (confirm('Yakin mau hapus semua history?')) {
                localStorage.removeItem(HISTORY_KEY);
                renderHistory();
            }
        }

        function renderHistory() {
            var list = document.getElementById('historyList');
            var history = getHistory();

            if (history.length === 0) {
                list.innerHTML =
                    '<div class="history-empty">' +
                        '<svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>' +
                        '<div>Belum ada riwayat download</div>' +
                    '</div>';
                return;
            }

            var html = '';
            history.forEach(function(item) {
                html +=
                    '<div class="history-item" data-url="' + item.video_no_watermark + '">' +
                        '<img src="' + item.thumbnail + '" class="history-thumb" alt="thumb">' +
                        '<div class="history-info">' +
                            '<div class="history-item-title">' + escapeHtml(item.title) + '</div>' +
                            '<div class="history-item-meta">' +
                                '<span>@' + escapeHtml(item.author) + '</span>' +
                                '<span>·</span>' +
                                '<span>' + item.date + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<button type="button" class="history-delete" data-id="' + item.id + '">' +
                            '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
                        '</button>' +
                    '</div>';
            });
            list.innerHTML = html;

            list.querySelectorAll('.history-item').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.history-delete')) return;
                    var url = this.getAttribute('data-url');
                    document.getElementById('urlInput').value = url;
                    document.getElementById('historyPanel').classList.remove('open');
                    document.getElementById('urlInput').focus();
                });
            });

            list.querySelectorAll('.history-delete').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var id = parseInt(this.getAttribute('data-id'));
                    removeFromHistory(id);
                });
            });
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);

        // ========== DOWNLOAD ==========
        document.getElementById('downloadBtn').addEventListener('click', async function() {
            var url = document.getElementById('urlInput').value.trim();
            var btn = document.getElementById('downloadBtn');
            var loading = document.getElementById('loading');
            var result = document.getElementById('result');
            var error = document.getElementById('error');

            if (!url) {
                document.getElementById('errorText').textContent = 'Masukin link TikTok dulu cuy!';
                error.classList.add('show');
                return;
            }

            result.classList.remove('show');
            error.classList.remove('show');
            loading.classList.add('show');
            btn.disabled = true;

            try {
                var response = await fetch('/api/tiktok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                var data = await response.json();

                if (!data.success) throw new Error(data.error || 'Gagal download');
                renderResult(data);
                addToHistory(data);
            } catch (err) {
                document.getElementById('errorText').textContent = err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
                btn.disabled = false;
            }
        });

        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('downloadBtn').click();
        });

        function renderResult(data) {
            var result = document.getElementById('result');
            var iconDownload = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>';
            var iconVideo = '<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>';
            var iconMusic = '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>';
            var iconEye = '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
            var iconHeart = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

            result.innerHTML =
                '<div class="video-card">' +
                    '<img src="' + data.thumbnail + '" class="video-thumb" alt="Thumbnail">' +
                    '<div class="video-title">' + data.title + '</div>' +
                    '<div class="video-author">👤 <strong>@' + data.author + '</strong></div>' +
                    '<div class="video-meta">' +
                        '<div class="meta-item">' + iconEye + ' ' + formatNumber(data.stats.plays) + '</div>' +
                        '<div class="meta-item likes">' + iconHeart + ' ' + formatNumber(data.stats.likes) + '</div>' +
                    '</div>' +
                    '<a href="' + data.video_no_watermark + '" target="_blank" class="download-btn primary" download>' + iconDownload + ' Download Tanpa Watermark</a>' +
                    (data.video_hd ? '<a href="' + data.video_hd + '" target="_blank" class="download-btn" download>' + iconVideo + ' Download HD</a>' : '') +
                    (data.music ? '<a href="' + data.music + '" target="_blank" class="download-btn" download>' + iconMusic + ' Download Audio</a>' : '') +
                '</div>';

            result.classList.add('show');
        }

        function formatNumber(n) {
            if (!n) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== AI CHAT ==========
        document.getElementById('chatClose').addEventListener('click', function() {
            document.getElementById('chatModal').classList.remove('show');
        });

        document.getElementById('chatModal').addEventListener('click', function(e) {
            if (e.target.id === 'chatModal') {
                document.getElementById('chatModal').classList.remove('show');
            }
        });

        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('chatSend').addEventListener('click', sendMessage);

        async function sendMessage() {
            var input = document.getElementById('chatInput');
            var sendBtn = document.getElementById('chatSend');
            var messages = document.getElementById('chatMessages');
            var message = input.value.trim();

            if (!message) return;

            messages.innerHTML += '<div class="message user">' + escapeHtml(message) + '</div>';
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            var typingId = 'typing-' + Date.now();
            messages.innerHTML += '<div class="message ai typing" id="' + typingId + '"><span></span><span></span><span></span></div>';
            messages.scrollTop = messages.scrollHeight;

            sendBtn.disabled = true;

            try {
                var response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, history: chatHistory })
                });

                var data = await response.json();
                var typingEl = document.getElementById(typingId);
                if (typingEl) typingEl.remove();

                if (!data.success) throw new Error(data.error || 'Gagal konek AI');

                messages.innerHTML += '<div class="message ai">' + escapeHtml(data.reply) + '</div>';
                messages.scrollTop = messages.scrollHeight;

                chatHistory.push({ role: 'user', content: message });
                chatHistory.push({ role: 'assistant', content: data.reply });

                if (chatHistory.length > 20) {
                    chatHistory = chatHistory.slice(-20);
                }
            } catch (err) {
                var typingEl2 = document.getElementById(typingId);
                if (typingEl2) typingEl2.remove();

                messages.innerHTML += '<div class="message ai" style="color:#fca5a5;">Error: ' + escapeHtml(err.message) + '</div>';
                messages.scrollTop = messages.scrollHeight;
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
