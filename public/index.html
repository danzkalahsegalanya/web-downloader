<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerozx TikTok Downloader + AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tiktok-cyan: #25f4ee;
            --tiktok-red: #fe2c55;
            --tiktok-pink: #ff0050;
            --ai-purple: #8b5cf6;
            --ai-blue: #3b82f6;
            --bg: #000000;
            --card: rgba(15, 15, 20, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #8a8a95;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 15% 15%, rgba(37, 244, 238, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(254, 44, 85, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            z-index: -1;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        .container {
            background: var(--card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 52px 48px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            position: relative;
            animation: containerIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red), var(--ai-purple));
            border-radius: 34px;
            z-index: -1;
            opacity: 0.35;
            filter: blur(24px);
            animation: borderGlow 5s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.65; }
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #000, #1a1a2e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(37, 244, 238, 0.3), 0 0 60px rgba(254, 44, 85, 0.2);
            animation: logoFloat 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(37, 244, 238, 0.15), rgba(254, 44, 85, 0.15));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .logo-icon svg {
            width: 40px; height: 40px;
            fill: white;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--tiktok-cyan), #fff, var(--tiktok-red));
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 4s linear infinite;
            letter-spacing: -1px;
        }

        @keyframes shine { to { background-position: 250% center; } }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 36px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        input {
            flex: 1;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        input::placeholder { color: var(--text-dim); }

        input:focus {
            outline: none;
            border-color: rgba(37, 244, 238, 0.5);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(37, 244, 238, 0.1);
        }

        button#downloadBtn {
            padding: 18px 34px;
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border: none;
            border-radius: 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(254, 44, 85, 0.4);
        }

        button#downloadBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(254, 44, 85, 0.6);
        }

        button#downloadBtn:disabled { opacity: 0.6; cursor: not-allowed; }
        button#downloadBtn svg { width: 18px; height: 18px; fill: white; }

        .result { margin-top: 28px; display: none; }
        .result.show { display: block; animation: resultIn 0.6s; }
        @keyframes resultIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .video-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s;
        }

        .video-card:hover {
            border-color: rgba(37, 244, 238, 0.3);
            box-shadow: 0 10px 40px rgba(254, 44, 85, 0.15);
        }

        .video-thumb {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .video-title { font-size: 16px; margin-bottom: 12px; font-weight: 700; line-height: 1.5; }
        .video-author { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; color: var(--text-dim); }
        .video-author strong { color: #fff; }
        .video-meta {
            display: flex; gap: 16px; flex-wrap: wrap;
            margin-bottom: 20px; padding: 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px; border: 1px solid var(--border);
        }
        .meta-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); }
        .meta-item svg { width: 14px; height: 14px; fill: var(--tiktok-cyan); }
        .meta-item.likes svg { fill: var(--tiktok-red); }

        .download-btn {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 15px 20px;
            background: rgba(37, 244, 238, 0.08);
            border: 1px solid rgba(37, 244, 238, 0.25);
            border-radius: 14px; color: var(--tiktok-cyan);
            text-align: center; text-decoration: none;
            margin-bottom: 10px; font-size: 14px; font-weight: 700;
            transition: all 0.3s;
        }

        .download-btn.primary {
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border-color: transparent; color: #fff;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
        }

        .download-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .download-btn:hover { transform: translateY(-2px); background: rgba(37, 244, 238, 0.15); }
        .download-btn.primary:hover { box-shadow: 0 10px 30px rgba(254, 44, 85, 0.5); }

        .loading { text-align: center; padding: 36px; color: var(--text-dim); display: none; }
        .loading.show { display: block; }

        .spinner {
            display: inline-block; width: 40px; height: 40px;
            border: 3px solid rgba(37, 244, 238, 0.15);
            border-top-color: var(--tiktok-cyan);
            border-right-color: var(--tiktok-red);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5; padding: 16px 20px;
            border-radius: 14px; margin-top: 24px;
            display: none; font-size: 14px;
            align-items: center; gap: 12px;
        }

        .error.show { display: flex; }
        .error svg { width: 22px; height: 22px; fill: #fca5a5; }

        .footer {
            text-align: center; margin-top: 36px;
            font-size: 12px; color: var(--text-dim);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .footer .dot {
            width: 6px; height: 6px; background: var(--tiktok-cyan);
            border-radius: 50%; box-shadow: 0 0 12px var(--tiktok-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .ai-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            animation: fabFloat 3s ease-in-out infinite;
        }

        @keyframes fabFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .ai-fab:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.7);
        }

        .ai-fab svg { width: 30px; height: 30px; fill: white; }

        .ai-fab::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(139, 92, 246, 0.4);
            animation: fabRing 2s infinite;
        }

        @keyframes fabRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .chat-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s;
        }

        .chat-modal.show { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .chat-window {
            width: 100%;
            max-width: 560px;
            height: 80vh;
            max-height: 700px;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: chatIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        @keyframes chatIn {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-avatar {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .chat-avatar svg { width: 22px; height: 22px; fill: white; }

        .chat-info { flex: 1; }
        .chat-name { font-size: 15px; font-weight: 700; color: #fff; }
        .chat-status {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-status .status-dot {
            width: 6px; height: 6px; background: #22c55e;
            border-radius: 50%; box-shadow: 0 0 8px #22c55e;
        }

        .chat-close {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .chat-close:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .chat-close svg { width: 18px; height: 18px; fill: currentColor; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: msgIn 0.3s;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message.typing {
            display: flex;
            gap: 4px;
            padding: 16px;
        }

        .message.typing span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--ai-purple);
            animation: typing 1.4s infinite;
        }

        .message.typing span:nth-child(2) { animation-delay: 0.2s; }
        .message.typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .chat-send {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .chat-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.6);
        }

        .chat-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .chat-send svg { width: 20px; height: 20px; fill: white; }

        @media (max-width: 600px) {
            .container { padding: 32px 22px; border-radius: 24px; }
            h1 { font-size: 26px; }
            .input-group { flex-direction: column; }
            button#downloadBtn { width: 100%; }
            .ai-fab { bottom: 20px; right: 20px; width: 56px; height: 56px; }
            .chat-window { height: 85vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/></svg>
            </div>
        </div>
        <h1>ZEROZX TIKTOK</h1>
        <div class="subtitle">Download video TikTok tanpa watermark</div>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste link TikTok di sini...">
            <button onclick="download()" id="downloadBtn">
                <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                Download
            </button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Ngambil video... sabar cuy</p>
        </div>
        <div class="error" id="error">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="errorText"></span>
        </div>
        <div class="result" id="result"></div>
        <div class="footer">
            <span class="dot"></span>
            Zerozx System v3.1 | TikTok + AI
        </div>
    </div>

    <!-- AI FAB BUTTON -->
    <button class="ai-fab" onclick="openChat()" title="Chat dengan AI">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.88.54 3.63 1.46 5.12L2 22l4.88-1.46C8.37 21.46 10.12 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.54 0-3-.42-4.24-1.16l-.5-.29-3.14.94.94-3.14-.29-.5C4.42 15 4 13.54 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
    </button>

    <!-- AI CHAT MODAL -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-window">
            <div class="chat-header">
                <div class="chat-avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.88.54 3.63 1.46 5.12L2 22l4.88-1.46C8.37 21.46 10.12 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
                </div>
                <div class="chat-info">
                    <div class="chat-name">Zerozx AI</div>
                    <div class="chat-status">
                        <span class="status-dot"></span> Online · DeepSeek
                    </div>
                </div>
                <button class="chat-close" onclick="closeChat()">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">Halo cuy! Gw Zerozx AI. Ada yang bisa gw bantu? Tanya apa aja, gw siap jawab!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="chat-send" id="chatSend" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = [];

        // ========== TIKTOK ==========
        async function download() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            if (!url) { showError('Masukin link TikTok dulu cuy!'); return; }

            result.classList.remove('show');
            error.classList.remove('show');
            loading.classList.add('show');
            btn.disabled = true;

            try {
                const response = await fetch('/api/tiktok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Gagal download');
                renderResult(data);
