<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerozx Downloader</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#fe2c55">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tiktok-cyan: #25f4ee;
            --tiktok-red: #fe2c55;
            --tiktok-pink: #ff0050;
            --ai-purple: #8b5cf6;
            --ai-blue: #3b82f6;
            --bg: #000000;
            --card: rgba(15, 15, 20, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #8a8a95;
        }

        body.light-mode {
            --bg: #f5f5f7;
            --card: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.08);
            --text: #1a1a1a;
            --text-dim: #6b6b70;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            transition: background 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 15% 15%, rgba(37, 244, 238, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(254, 44, 85, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
            z-index: -1;
        }

        .container {
            background: var(--card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px 48px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: containerIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red), var(--ai-purple));
            border-radius: 34px;
            z-index: -1;
            opacity: 0.35;
            filter: blur(24px);
        }

        .burger-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s;
            z-index: 10;
        }

        .burger-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(37, 244, 238, 0.4); }
        .burger-btn span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }

        .side-menu {
            position: fixed;
            top: 0; left: -320px;
            width: 300px; height: 100vh;
            background: var(--card);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--border);
            z-index: 9999;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .side-menu.open { left: 0; }

        .side-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .side-menu-title {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .side-close {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .side-close:hover { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
        .side-close svg { width: 16px; height: 16px; fill: currentColor; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            width: 100%;
        }

        .menu-item:hover { background: rgba(37, 244, 238, 0.08); border-color: rgba(37, 244, 238, 0.3); transform: translateX(5px); }
        .menu-item svg { width: 20px; height: 20px; fill: var(--tiktok-cyan); flex-shrink: 0; }
        .menu-item.ai svg { fill: var(--ai-purple); }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .menu-overlay.show { opacity: 1; pointer-events: auto; }

        .history-panel {
            position: fixed;
            top: 0; right: -100%;
            width: 100%; max-width: 480px;
            height: 100vh;
            background: var(--card);
            backdrop-filter: blur(30px);
            border-left: 1px solid var(--border);
            z-index: 9999;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history-panel.open { right: 0; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title-wrap { display: flex; align-items: center; gap: 10px; }
        .panel-title-wrap svg { width: 22px; height: 22px; fill: var(--tiktok-cyan); }
        .panel-title { font-size: 18px; font-weight: 800; }

        .panel-actions { display: flex; gap: 8px; align-items: center; }

        .clear-history-btn {
            padding: 8px 14px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #fca5a5;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .panel-close {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-close:hover { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
        .panel-close svg { width: 16px; height: 16px; fill: currentColor; }

        .history-list { display: flex; flex-direction: column; gap: 10px; }

        .history-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            align-items: center;
        }

        .history-item:hover { border-color: rgba(37, 244, 238, 0.3); }

        .history-thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
        .history-info { flex: 1; overflow: hidden; }
        .history-item-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 8px; }

        .history-delete {
            width: 30px; height: 30px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .history-delete svg { width: 14px; height: 14px; fill: currentColor; }

        .history-empty { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 13px; }
        .history-empty svg { width: 48px; height: 48px; fill: var(--text-dim); opacity: 0.3; margin-bottom: 12px; }

        .logo-wrap { display: flex; justify-content: center; margin-bottom: 20px; }

        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #000, #1a1a2e);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(37, 244, 238, 0.3), 0 0 50px rgba(254, 44, 85, 0.2);
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .logo-icon svg { width: 36px; height: 36px; fill: white; }

        h1 {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--text), var(--tiktok-red));
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine { to { background-position: 250% center; } }

        .subtitle { text-align: center; color: var(--text-dim); margin-bottom: 20px; font-size: 14px; }

        .platform-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .platform-tab {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            border-radius: 9px;
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .platform-tab.active { background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red)); color: #fff; }
        .platform-tab svg { width: 14px; height: 14px; fill: currentColor; }

        .batch-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .batch-label { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
        .batch-label svg { width: 16px; height: 16px; fill: var(--text-dim); }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .switch input:checked + .slider { background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-red)); }
        .switch input:checked + .slider:before { transform: translateX(20px); }

        textarea, input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            resize: vertical;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: rgba(37, 244, 238, 0.5);
            box-shadow: 0 0 0 4px rgba(37, 244, 238, 0.1);
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }

        button#downloadBtn {
            padding: 16px 30px;
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(254, 44, 85, 0.4);
        }

        button#downloadBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(254, 44, 85, 0.6); }
        button#downloadBtn:disabled { opacity: 0.6; cursor: not-allowed; }
        button#downloadBtn svg { width: 18px; height: 18px; fill: white; }

        .result { margin-top: 20px; }
        .video-card { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 12px; }
        .video-thumb { width: 100%; border-radius: 14px; margin-bottom: 18px; }
        .video-title { font-size: 15px; margin-bottom: 10px; font-weight: 700; line-height: 1.5; }
        .video-author { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: var(--text-dim); }
        .video-author strong { color: var(--text); }

        .video-meta {
            display: flex; gap: 14px; flex-wrap: wrap;
            margin-bottom: 18px; padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px; border: 1px solid var(--border);
        }

        .meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }
        .meta-item svg { width: 13px; height: 13px; fill: var(--tiktok-cyan); }
        .meta-item.likes svg { fill: var(--tiktok-red); }

        .download-btn {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 14px 18px;
            background: rgba(37, 244, 238, 0.08);
            border: 1px solid rgba(37, 244, 238, 0.25);
            border-radius: 12px; color: var(--tiktok-cyan);
            text-align: center; text-decoration: none;
            margin-bottom: 8px; font-size: 13px; font-weight: 700;
            transition: all 0.3s;
        }

        .download-btn.primary {
            background: linear-gradient(135deg, var(--tiktok-red), var(--tiktok-pink));
            border-color: transparent; color: #fff;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
        }

        .download-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .download-btn:hover { transform: translateY(-2px); }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 10px;
            color: var(--ai-purple);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .action-btn:hover { background: rgba(139, 92, 246, 0.2); }
        .action-btn svg { width: 14px; height: 14px; fill: currentColor; }

        .loading { text-align: center; padding: 30px; color: var(--text-dim); display: none; }
        .loading.show { display: block; }

        .spinner {
            display: inline-block; width: 36px; height: 36px;
            border: 3px solid rgba(37, 244, 238, 0.15);
            border-top-color: var(--tiktok-cyan);
            border-right-color: var(--tiktok-red);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5; padding: 14px 18px;
            border-radius: 12px; margin-top: 20px;
            display: none; font-size: 13px;
            align-items: center; gap: 10px;
        }

        .error.show { display: flex; }
        .error svg { width: 20px; height: 20px; fill: #fca5a5; }
