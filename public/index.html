<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerozx Video Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --accent-dark: #db2777;
            --bg: #0a0a0f;
            --card: rgba(20, 20, 30, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
            --text-dim: #94a3b8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            z-index: -1;
            animation: bgShift 15s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }

        .container {
            background: var(--card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 48px;
            width: 100%;
            max-width: 620px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--primary));
            border-radius: 30px;
            z-index: -1;
            opacity: 0.3;
            filter: blur(20px);
            animation: borderGlow 4s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Logo custom */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a5b4fc, #f0abfc, #a5b4fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            letter-spacing: -0.5px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 32px;
            font-size: 14px;
            font-weight: 400;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-dim);
            cursor: pointer;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.03);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .tab svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        input::placeholder {
            color: var(--text-dim);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        button#downloadBtn {
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button#downloadBtn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button#downloadBtn:hover::before {
            left: 100%;
        }

        button#downloadBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        button#downloadBtn:active {
            transform: translateY(0);
        }

        button#downloadBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        button#downloadBtn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .result {
            margin-top: 24px;
            display: none;
        }

        .result.show {
            display: block;
            animation: resultIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes resultIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }

        .video-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.1);
        }

        .video-thumb {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        .video-thumb:hover {
            transform: scale(1.02);
        }

        .video-title {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 600;
            line-height: 1.4;
        }

        .video-meta {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 18px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .video-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .video-meta svg {
            width: 14px;
            height: 14px;
            fill: var(--text-dim);
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            color: #a5b4fc;
            text-align: center;
            text-decoration: none;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: transparent;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .download-btn:hover svg {
            transform: translateY(3px);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a5b4fc;
            margin: 20px 0 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .section-title svg {
            width: 16px;
            height: 16px;
            fill: #a5b4fc;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 16px 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
            animation: shake 0.5s;
            align-items: center;
            gap: 10px;
        }

        .error.show {
            display: flex;
        }

        .error svg {
            width: 20px;
            height: 20px;
            fill: #fca5a5;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer .dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 600px) {
            .container { padding: 28px 20px; border-radius: 20px; }
            h1 { font-size: 24px; }
            .input-group { flex-direction: column; }
            button#downloadBtn { width: 100%; }
            .video-meta { font-size: 12px; gap: 10px; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO CUSTOM -->
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <h1>ZEROZX DOWNLOADER</h1>
        <div class="subtitle">TikTok & YouTube tanpa watermark — Gratis & Cepat</div>

        <!-- TABS -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('tiktok', event)">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/></svg>
                TikTok
            </div>
            <div class="tab" onclick="switchTab('youtube', event)">
                <svg viewBox="0 0 24 24"><path d="M23.5 6.19a3.02 3.02 0 00-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 00.5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 002.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 002.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>
                YouTube
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste link TikTok/YouTube di sini...">
            <button onclick="download()" id="downloadBtn">
                <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                Download
            </button>
        </div>

        <!-- LOADING -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Ngambil video... sabar cuy</p>
        </div>

        <!-- ERROR -->
        <div class="error" id="error">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="errorText"></span>
        </div>

        <!-- RESULT -->
        <div class="result" id="result"></div>

        <div class="footer">
            <span class="dot"></span>
            Zerozx System v2.0 | No watermark | Free
        </div>
    </div>

    <script>
        let currentTab = 'tiktok';

        function switchTab(tab, event) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (event) event.currentTarget.classList.add('active');

            const input = document.getElementById('urlInput');
            if (tab === 'tiktok') {
                input.placeholder = 'Paste link TikTok (contoh: https://vt.tiktok.com/xxx)';
            } else {
                input.placeholder = 'Paste link YouTube (contoh: https://youtube.com/watch?v=xxx)';
            }

            document.getElementById('result').classList.remove('show');
            document.getElementById('error').classList.remove('show');
        }

        async function download() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            if (!url) {
                showError('Masukin link dulu cuy!');
                return;
            }

            result.classList.remove('show');
            error.classList.remove('show');
            loading.classList.add('show');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0;"></div> Loading...';

            try {
                const endpoint = currentTab === 'tiktok' ? '/api/tiktok' : '/api/youtube';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Gagal download');
                renderResult(data);

            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('show');
                btn.disabled = false;
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> Download';
            }
        }

        function renderResult(data) {
            const result = document.getElementById('result');
            let html = '';

            const iconDownload = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>';
            const iconVideo = '<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>';
            const iconMusic = '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>';
            const iconUser = '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
            const iconClock = '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>';
            const iconEye = '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';

            if (data.platform === 'tiktok') {
                html = `
                    <div class="video-card">
                        <img src="${data.thumbnail}" class="video-thumb" alt="Thumbnail">
                        <div class="video-title">${data.title}</div>
                        <div class="video-meta">
                            <span>${iconUser} ${data.author}</span>
                            <span>${iconClock} ${data.duration}s</span>
                        </div>
                        <a href="${data.video_no_watermark}" target="_blank" class="download-btn" download>
                            ${iconDownload} Download Tanpa Watermark
                        </a>
                        ${data.video_hd ? `
                        <a href="${data.video_hd}" target="_blank" class="download-btn" download>
                            ${iconVideo} Download HD
                        </a>` : ''}
                        ${data.music ? `
                        <a href="${data.music}" target="_blank" class="download-btn" download>
                            ${iconMusic} Download Audio
                        </a>` : ''}
                    </div>
                `;
            } else if (data.platform === 'youtube') {
                html = `
                    <div class="video-card">
                        <img src="${data.thumbnail}" class="video-thumb" alt="Thumbnail">
                        <div class="video-title">${data.title}</div>
                        <div class="video-meta">
                            <span>${iconUser} ${data.author}</span>
                            <span>${iconClock} ${data.duration}s</span>
                            <span>${iconEye} ${data.views} views</span>
                        </div>
                        <div class="section-title">${iconVideo} Video</div>
                        ${data.video.map(v => `
                            <a href="${v.url}" target="_blank" class="download-btn" download>
                                ${iconDownload} ${v.quality} (${v.size})
                            </a>
                        `).join('')}
                        <div class="section-title">${iconMusic} Audio</div>
                        ${data.audio.map(a => `
                            <a href="${a.url}" target="_blank" class="download-btn" download>
                                ${iconMusic} ${a.quality}
                            </a>
                        `).join('')}
                    </div>
                `;
            }

            result.innerHTML = html;
            result.classList.add('show');
        }

        function showError(msg) {
            const error = document.getElementById('error');
            document.getElementById('errorText').textContent = msg;
            error.classList.add('show');
        }

        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') download();
        });
    </script>
</body>
</html>
